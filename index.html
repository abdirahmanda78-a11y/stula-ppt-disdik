<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unduh PPT STULA Disdik</title>
<style>
body { font-family: Georgia, serif; background:#F6F1E7; color:#152238; margin:0; padding:32px 20px; }
main { max-width: 560px; margin: 0 auto; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
p { font-family: Calibri, sans-serif; font-size: 17px; line-height: 1.45; }
button { font-family: Calibri, sans-serif; font-size: 18px; background:#1F5C4A; color:#F6F1E7; border:0; border-radius:8px; padding:16px 22px; width:100%; }
small { display:block; margin-top:18px; color:#5c6570; font-family: Calibri, sans-serif; }
</style>
</head>
<body>
<main>
<h1>STULA PKA<br>Dinas Pendidikan Kabupaten Cirebon</h1>
<p>17 slide. SILULUS, SPMB, dan SERDADU. Ketuk tombol di bawah. Berkas tersimpan di HP, lalu buka dengan PowerPoint atau WPS.</p>
<button id="btn" type="button" onclick="unduh()">Unduh file PPT</button>
<small id="msg">Buka halaman ini di Chrome. Jangan ketuk berkas dari kartu Grok.</small>
</main>
<script>
async function unduh() {
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.textContent = 'Menyiapkan berkas...';
  try {
    const parts = ['p1.txt','p2.txt','p3.txt','p4.txt'];
    let b64 = '';
    for (const p of parts) {
      const r = await fetch(p);
      if (!r.ok) throw new Error(p);
      b64 += (await r.text()).replace(/\s+/g,'');
    }
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr], {type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'STULA-PKA-Disdik-Kab-Cirebon.pptx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    msg.textContent = 'Berkas sudah diunduh. Cek folder Download, lalu buka dengan WPS atau PowerPoint.';
  } catch (e) {
    msg.textContent = 'Gagal menyiapkan berkas. Muat ulang halaman, lalu coba lagi.';
  }
  btn.disabled = false;
}
</script>
</body>
</html>
